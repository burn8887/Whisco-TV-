<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline — Whisco TV</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #0a0a0f; color: #e4e4e7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center; padding: 24px;
    }
    img { width: 120px; opacity: .9; margin-bottom: 16px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: #a1a1aa; font-size: 14px; margin: 0 0 20px; max-width: 320px; }
    button {
      background: linear-gradient(to right, #f97316, #db2777);
      color: #fff; border: 0; padding: 12px 28px; border-radius: 999px;
      font-weight: 700; font-size: 14px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div>
    <img src="/whisco-mascot.png" alt="Whisco" />
    <h1>You're offline</h1>
    <p>Whisco couldn't sniff out an internet connection. Reconnect and try again — your shows will be right where you left them.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
