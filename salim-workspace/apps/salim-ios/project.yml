name: Salim
options:
  bundleIdPrefix: app.salim
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.6.0'
    CURRENT_PROJECT_VERSION: 6
    DEVELOPMENT_TEAM: ''
targets:
  Salim:
    type: application
    platform: iOS
    sources: [Salim]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.salim.ios.demo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Salim/Info.plist
        TARGETED_DEVICE_FAMILY: '1,2'
        OTHER_LDFLAGS: '$(inherited) -lsqlite3'
  SalimTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SalimTests]
    dependencies:
      - target: Salim
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Salim:
    build:
      targets:
        Salim: all
    test:
      targets: [SalimTests]
