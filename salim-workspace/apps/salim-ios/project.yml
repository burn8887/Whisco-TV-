name: Salim
options:
  bundleIdPrefix: com.salimdrive
  deploymentTarget:
    iOS: '17.0'
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 13.11.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    from: 3.1.0
settings:
  base:
    SWIFT_VERSION: '5.0'
    ADMOB_APP_ID: 'ca-app-pub-3940256099942544~1458002511'
    SALIM_ADS_ENABLED: 'NO'
    ADMOB_BANNER_ID: 'ca-app-pub-3940256099942544/2934735716'
    SALIM_REPORT_API_BASE_URL: ''
    MARKETING_VERSION: '0.7.0'
    CURRENT_PROJECT_VERSION: 7
    DEVELOPMENT_TEAM: ''
targets:
  Salim:
    type: application
    platform: iOS
    sources: [Salim]
    dependencies:
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
        product: GoogleUserMessagingPlatform
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.salimdrive.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Salim/Info.plist
        TARGETED_DEVICE_FAMILY: '1,2'
        OTHER_LDFLAGS: '$(inherited) -lsqlite3'
  SalimTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SalimTests]
    dependencies:
      - target: Salim
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Salim:
    build:
      targets:
        Salim: all
    test:
      targets: [SalimTests]
