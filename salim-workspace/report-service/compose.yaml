services:
  salim-reports:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      SALIM_REPORT_DB: /app/data/reports.sqlite3
      HOST: 0.0.0.0
      PORT: 8080
    volumes:
      - salim_reports:/app/data
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=8m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
volumes:
  salim_reports:
