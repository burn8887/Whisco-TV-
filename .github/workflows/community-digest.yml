name: Community post digest

# Every Monday 06:00 UTC (09:00 Bahrain): opens a GitHub Issue containing a
# BASIL-READY BRIEF — pre-formatted input for the posting bot (Basil), with a
# ROBO-COMPLIANCE PRE-CHECK (code-enforced Fatema rules) run before creation:
#   * blacklist scan (sanctioned names may never appear, even negatively)
#   * floors rule (public copy says 600+ / 16,000+, never exact counts)
#   * disclosure line present in every third-party draft
#   * every title link verified HTTP 200 before it enters the brief
#
# Pipeline (Bot Team Charter v1.0, 2026-09-12):
#   cron builds brief -> founder pastes Issue body to BASIL -> Basil's pack ->
#   founder pastes to FATEMA -> verdict -> FOUNDER posts by hand -> Basil logs.
#
# HARD RULE (owner's doctrine): nothing in this workflow posts anywhere.
# Automation prepares; humans press send in third-party communities.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Build Basil-ready brief with compliance pre-check
        uses: actions/github-script@v7
        with:
          script: |
            // ---------- ROBO-COMPLIANCE (Fatema's mechanical rules, in code) ----------
            const BLACKLIST = /al ?manar|mayadeen|press ?tv|irib|hezbollah|al ?alam|rojava|ronahi|welat|al ?wilayah|damascus radio/i;
            const scrubCounts = (s) => s
              .replace(/\b\d{3,4}\+? (live )?channels\b/gi, "600+ live channels")
              .replace(/\b1[4-9][,.]?\d{3}\+? (titles|movies)/gi, "16,000+ titles");
            const complianceLog = [];

            // ---------- 1. Fresh titles from live catalog ----------
            const res = await fetch("https://www.whisco.tv/api/mobile/v1/home");
            const home = await res.json();
            const rows = home.rows || [];
            const newRow = rows.find(r => (r.title || "").toLowerCase().includes("new")) || rows[0] || { items: [] };
            const candidates = (newRow.items || []).slice(0, 10);

            // ---------- 2. Verify every link is alive (HTTP 200) ----------
            const fresh = [];
            for (const t of candidates) {
              if (fresh.length >= 6) break;
              if (BLACKLIST.test(t.name || "")) { complianceLog.push(`⛔ excluded title (blacklist match): ${t.slug}`); continue; }
              const url = `https://whisco.tv/title/${t.slug}`;
              try {
                const r = await fetch(url, { method: "HEAD", redirect: "follow" });
                if (r.ok) {
                  const lang = t.language ? ` · ${t.language}` : "";
                  fresh.push(`- **${t.name}**${lang} → ${url}?utm_source=community&utm_medium=post ✅200`);
                } else complianceLog.push(`⚠️ dropped dead link (${r.status}): ${t.slug}`);
              } catch { complianceLog.push(`⚠️ dropped unreachable link: ${t.slug}`); }
            }

            // ---------- 3. Seed drafts (floors rule applied, disclosure baked in) ----------
            const DISCLOSURE = "(I built this — declared interest.)";
            const seeds = [
              { room: "Expat.com Bahrain", mode: "REPLY-ONLY in existing Firestick/streaming threads", risk: "LOW",
                text: `If the Firestick box keeps freezing, most of what's on it is actually legal and free anyway — Indian/Pakistani/Filipino/Arabic channels broadcast free-to-air. I run whisco.tv which organizes 600+ live channels legally. ${DISCLOSURE} For live EPL/cricket you still need TOD/beIN — that part no free service can do legally.` },
              { room: "r/cordcutters", mode: "POST allowed with Self-Promo flair", risk: "MEDIUM",
                text: `[Self-Promo] Built a free legal streaming platform for Middle East expats — 600+ live channels, 16,000+ titles, 13 languages, no signup. ${DISCLOSURE} Feedback welcome, especially from anyone cord-cutting outside the US.` },
              { room: "r/ABCDesis", mode: "REPLY-ONLY in Jadoo-box-type threads", risk: "MEDIUM",
                text: `Legal alternative for parents' Desi TV: most Hindi/Urdu channels are free-to-air and studios like Goldmines/Shemaroo publish full movies officially. whisco.tv (mine — disclosure) aggregates those legally, free. For live cricket you'll still need a paid sports app.` },
              { room: "Turkish drama communities", mode: "REPLY-ONLY, value-first, link only if sub rules allow", risk: "HIGH",
                text: `The official broadcaster channels (ATV, Star, Show, Kanal D, NOW, TRT) publish full episodes free — that's the legal HD source. We've organized 61 series / 3,600+ episodes at whisco.tv with resume/watchlist ${DISCLOSURE}. YouTube auto-captions cover EN on most.` },
              { room: "WhatsApp/Telegram (founder's own groups)", mode: "FAMILY-FORWARD share, founder posts personally", risk: "LOW",
                text: `New this Friday on Whisco TV (free, no signup): [Basil: pick 1-2 from Fresh list — lead with LANGUAGE + runtime]. https://whisco.tv/new` },
            ];

            // Compliance pass over every seed
            for (const s of seeds) {
              if (BLACKLIST.test(s.text)) { s.text = "⛔ SEED BLOCKED — blacklist match. Basil: draft a replacement."; complianceLog.push(`⛔ seed blocked for ${s.room}`); }
              const scrubbed = scrubCounts(s.text);
              if (scrubbed !== s.text) { complianceLog.push(`✂️ floors applied in ${s.room} seed`); s.text = scrubbed; }
              if (s.risk !== "LOW" || s.room.startsWith("r/")) {
                if (!/disclos|mine|I built|I run/i.test(s.text)) { s.text += ` ${DISCLOSURE}`; complianceLog.push(`➕ disclosure inserted in ${s.room}`); }
              }
            }

            const week = new Date().toISOString().slice(0, 10);
            const body = [
              `## 📮 BASIL BRIEF — week of ${week}`,
              `_Founder: paste everything below this line into Basil's chat. Pre-checked by robo-compliance (log at bottom)._`,
              "",
              "---",
              "",
              `**BASIL ASSIGNMENT — weekly post pack, week of ${week}.**`,
              `Produce the Fatema-ready pack per your charter: per-room final text, mode, risk rating (yours + map's), disclosure included, post/skip recommendation. Public counts: floors only (600+ / 16,000+). All title links below are verified HTTP 200 as of this brief. Rules last verified 5 Sep 2026 — flag "founder to re-check sidebar before posting" on every room.`,
              "",
              "### Fresh this week (verified live)",
              fresh.length ? fresh.join("\n") : "_Quiet week — lead with https://whisco.tv/new instead._",
              "",
              "### Seed drafts (adapt per room — never paste cold)",
              ...seeds.map((s, i) => [`**${i + 1}. ${s.room}** — ${s.mode} — risk ${s.risk}`, `> ${s.text}`, ""].join("\n")),
              "### Standing rules (charter §4 — breaking any voids the pack)",
              "- Humans post in third-party rooms; you draft to the last click",
              "- Max 1 Whisco mention per room per week · disclosure every time",
              "- NEVER cold-post country subs (r/dubai, r/Bahrain, r/UAE…)",
              "- No sports promises, no exact counts, no invented numbers",
              "- SKIP recommendations are valued output",
              "",
              "---",
              "",
              "### 🤖 Robo-compliance log (for Fatema's ledger)",
              complianceLog.length ? complianceLog.map(l => `- ${l}`).join("\n") : "- All checks passed clean: blacklist ✅ · floors ✅ · disclosure ✅ · links ✅",
              "",
              "_Flow: this Issue → Basil → pack → Fatema verdict → FOUNDER posts → Basil logs → close this Issue._"
            ].join("\n");

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📮 Basil brief — week of ${week}`,
              body
            });
