name: Geo audit (channel-level, one-off)

# One-off, manually-dispatched ops job (2026-09-14 geo-exposure finding).
# NOT on a schedule. Safe to delete once the permanent check-vod fix is live.
#
# Maps every title to its YouTube channel via oEmbed (fast, not rate-limited),
# probes one video per channel for GCC availability, then verifies every title
# of a blocked channel individually before hiding it.
#
# A per-title brute force cannot work: YouTube returns HTTP 429 after a few
# hundred rapid watch-page fetches from one IP (observed from both a sandbox and
# a GitHub runner). Channel-level narrowing turns ~8,400 probes into ~110.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report only, write nothing (true/false)"
        required: false
        default: "false"
      mode:
        description: "audit = full channel-level sweep | verify = named slugs"
        required: false
        default: "audit"
      slugs:
        description: "mode=verify: comma-separated title slugs"
        required: false
        default: ""
      hide:
        description: "mode=verify: hide titles with a clean list-backed BLOCKED verdict"
        required: false
        default: "false"

concurrency:
  group: geo-reaudit
  cancel-in-progress: false

jobs:
  reaudit:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Prisma generate
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run channel-level geo audit (mode=audit)
        if: inputs.mode != 'verify'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/geo_channel_audit.mjs "${{ inputs.dry_run }}"

      - name: Run targeted geo verify (mode=verify)
        if: inputs.mode == 'verify'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/geo_verify.mjs "${{ inputs.slugs }}" "${{ inputs.hide }}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geo-audit-results
          path: /tmp/geo_channel_audit.json
          if-no-files-found: ignore
          retention-days: 30
