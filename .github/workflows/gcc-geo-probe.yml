name: GCC geo probe (Gulf vantage)

# Runs the watch-page availability check from INSIDE the Gulf, through a SOCKS5
# tunnel to the vantage box. Why this exists: the production sweep runs from a US
# region, so it can only see a block it is itself subject to — Gulf-only blocks
# (playable in the US, blocked in the GCC) are invisible to it, which is how three
# blocked titles were restored to the live site on 2026-09-14 and how four more
# were re-activated on 2026-09-13.
#
# Nothing of ours runs on the vantage box: it is only an SSH exit node. The
# private key lives in repo secrets (GCC_VPS_SSH_KEY) and never in the repo.
#
# Manual dispatch only. Writes nothing unless the exit is CONFIRMED to be in a
# GCC country and the reading is a clean, list-backed BLOCKED-ALL-GCC verdict.

on:
  workflow_dispatch:
    inputs:
      slugs:
        description: "Comma-separated title slugs to verify (e.g. maniac-cop-2,...)"
        required: false
        default: ""
      ids:
        description: "Optional comma-separated YouTube video IDs (test the vantage itself)"
        required: false
        default: ""
      hide:
        description: "Hide titles with a clean list-backed BLOCKED-ALL-GCC verdict"
        required: false
        default: "false"

concurrency:
  group: gcc-geo-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Prisma generate
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Install vantage key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.GCC_VPS_SSH_KEY }}" > ~/.ssh/gcc_vps
          chmod 600 ~/.ssh/gcc_vps

      - name: Open SOCKS5 tunnel through the Gulf vantage
        run: |
          ssh -i ~/.ssh/gcc_vps -N -D 1080 \
            -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -o StrictHostKeyChecking=accept-new \
            -p "${{ secrets.GCC_VPS_PORT || '22' }}" \
            "${{ secrets.GCC_VPS_USER }}@${{ secrets.GCC_VPS_HOST }}" &
          for i in $(seq 1 15); do
            if curl -s --socks5-hostname 127.0.0.1:1080 --max-time 15 https://ipinfo.io/json > /tmp/exit.json; then break; fi
            sleep 2
          done
          echo "tunnel exit: $(cat /tmp/exit.json 2>/dev/null | head -c 300)"

      - name: Probe
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SOCKS_PROXY: socks5h://127.0.0.1:1080
        run: node scripts/gcc_geo_probe.mjs "${{ inputs.slugs }}" "${{ inputs.hide }}" "${{ inputs.ids }}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcc-geo-probe
          path: /tmp/gcc_geo_probe.json
          if-no-files-found: ignore
          retention-days: 30
