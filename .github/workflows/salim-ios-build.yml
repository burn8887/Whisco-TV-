name: Salim iOS simulator build
on:
  push:
    branches: [arena/3070ca80-whisco-tv]
    paths:
      - 'salim-workspace/apps/salim-ios/**'
      - 'salim-workspace/tools/materialize.py'
      - '.github/workflows/salim-ios-build.yml'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: salim-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Select installed Xcode 26.3
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          echo "::notice title=Salim Apple SDK::$(xcodebuild -version | tr '\n' ' ')"
      - name: Prepare Salim source and Xcode project
        run: |
          python3 salim-workspace/tools/materialize.py --output "$RUNNER_TEMP/salim"
          brew install xcodegen
          cd "$RUNNER_TEMP/salim/apps/salim-ios"
          xcodegen generate
      - name: Build and test unsigned simulator app
        working-directory: ${{ runner.temp }}/salim/apps/salim-ios
        run: |
          device=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for runtime,devices in data["devices"].items() if "iOS" in runtime for d in devices if d["name"].startswith("iPhone")))')
          set +e
          xcodebuild -project Salim.xcodeproj -scheme Salim -destination "id=$device" -derivedDataPath "$RUNNER_TEMP/salim-derived" -resultBundlePath "$RUNNER_TEMP/salim-ios-results.xcresult" CODE_SIGNING_ALLOWED=NO test 2>&1 | tee "$RUNNER_TEMP/salim-ios-build.log"
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            python3 - <<'PYERROR'
          import os
          from pathlib import Path
          text=Path(os.environ['RUNNER_TEMP']+'/salim-ios-build.log').read_text(errors='replace')
          errors=[line for line in text.splitlines() if 'error:' in line.lower() or 'failed' in line.lower()]
          tail='\n'.join(errors[-40:]+text.splitlines()[-30:])[-16000:]
          print('::error title=Salim iOS build::'+tail.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PYERROR
          fi
          exit "$result"
      - name: Compile unsigned device archive (not installable or uploadable)
        working-directory: ${{ runner.temp }}/salim/apps/salim-ios
        run: |
          set +e
          xcodebuild -project Salim.xcodeproj -scheme Salim -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Salim-unsigned.xcarchive" CODE_SIGNING_ALLOWED=NO archive 2>&1 | tee "$RUNNER_TEMP/salim-ios-archive.log"
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            python3 - <<'PYERROR'
          import os
          from pathlib import Path
          lines=Path(os.environ['RUNNER_TEMP']+'/salim-ios-archive.log').read_text(errors='replace').splitlines()
          text='\n'.join([x for x in lines if 'error:' in x.lower()][-30:]+lines[-20:])[-14000:]
          print('::error title=Salim device archive::'+text.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PYERROR
          fi
          exit "$result"
      - name: Preserve app permissions in download archives
        run: |
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/salim-derived/Build/Products/Debug-iphonesimulator/Salim.app" "$RUNNER_TEMP/Salim-simulator.zip"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/Salim-unsigned.xcarchive" "$RUNNER_TEMP/Salim-unsigned-device-archive.zip"
      - name: Expose actual XCTest results
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/salim-ios-results.xcresult" ]; then
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/salim-ios-results.xcresult" > "$RUNNER_TEMP/salim-ios-test-summary.json"
            python3 - <<'PYRESULT'
          import json,os
          from pathlib import Path
          result=json.loads(Path(os.environ['RUNNER_TEMP']+'/salim-ios-test-summary.json').read_text())
          text=json.dumps(result)[:15000]
          print('::notice title=Salim XCTest evidence::'+text.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PYRESULT
          fi
      - name: Retain unsigned app and test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: salim-ios-simulator
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/Salim-simulator.zip
            ${{ runner.temp }}/Salim-unsigned-device-archive.zip
            ${{ runner.temp }}/salim-ios-archive.log
            ${{ runner.temp }}/salim-ios-results.xcresult
            ${{ runner.temp }}/salim-ios-build.log
            ${{ runner.temp }}/salim-ios-test-summary.json
