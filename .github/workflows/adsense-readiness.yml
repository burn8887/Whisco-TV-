name: AdSense readiness scan

# Weekly check of the pages an AdSense reviewer reaches (Nov 2026 recovery plan).
# Results go to one Issue labelled adsense-readiness; findings never fail the run.
on:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run readiness scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ADSENSE_CLIENT_ID: ${{ secrets.ADSENSE_CLIENT_ID }}
          ADSENSE_CLIENT_SECRET: ${{ secrets.ADSENSE_CLIENT_SECRET }}
          ADSENSE_REFRESH_TOKEN: ${{ secrets.ADSENSE_REFRESH_TOKEN }}
        run: node scripts/adsense_readiness.mjs
