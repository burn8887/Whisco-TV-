name: Sahm Android build
on:
  push:
    branches: [arena/3070ca80-whisco-tv]
    paths:
      - 'sahm-workspace/apps/sahm-android/**'
      - 'sahm-workspace/tools/materialize.py'
      - 'sahm-workspace/tools/report_native_tests.py'
      - 'sahm-workspace/tools/check_android_apk.py'
      - '.github/workflows/sahm-android-build.yml'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: sahm-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - name: Materialize only Sahm outside the host checkout
        run: python3 sahm-workspace/tools/materialize.py --output "$RUNNER_TEMP/sahm"
      - name: Install Sahm SDK using the runner's native Android tooling
        run: |
          test -n "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'

      - name: Compile, unit test, lint and package Sahm only
        working-directory: ${{ runner.temp }}/sahm/apps/sahm-android
        run: |
          set +e
          gradle --no-daemon :core:test :app:assembleDebug :app:bundleRelease :app:assembleDebugAndroidTest :app:lintDebug 2>&1 | tee "$RUNNER_TEMP/sahm-android-build.log"
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            python3 - <<'PYERROR'
          import os
          from pathlib import Path
          text=Path(os.environ['RUNNER_TEMP']+'/sahm-android-build.log').read_text(errors='replace')
          compiler='\n'.join(line for line in text.splitlines() if line.startswith('e:'))[:3000]
          if compiler:
              print('::error title=Sahm Kotlin compiler::'+compiler.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          tail='\n'.join(text.splitlines()[-45:])[-3500:]
          print('::error title=Sahm Android build::'+tail.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          import xml.etree.ElementTree as ET
          report=Path('app/build/reports/lint-results-debug.xml')
          if report.exists():
              for issue in ET.parse(report).getroot().findall('issue'):
                  if issue.get('severity') not in ('Error','Fatal'): continue
                  location=issue.find('location')
                  message=str(issue.attrib)+' '+str(location.attrib if location is not None else '')
                  print('::error title=Sahm lint::'+message[:3000].replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PYERROR
          fi
          exit "$result"
      - name: Check APK ZIP and 64-bit ELF alignment
        run: |
          apk="$RUNNER_TEMP/sahm/apps/sahm-android/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "$apk"
          python3 sahm-workspace/tools/check_android_apk.py "$apk"
          echo '::notice title=Sahm APK packaging::ZIP alignment verified at 16 KB'
      - name: Retain native test artifacts (not a store upload)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: sahm-android-test-build
          retention-days: 14
          path: |
            ${{ runner.temp }}/sahm/apps/sahm-android/app/build/outputs/apk/**/*.apk
            ${{ runner.temp }}/sahm/apps/sahm-android/app/build/outputs/bundle/**/*.aab
            ${{ runner.temp }}/sahm/apps/sahm-android/app/build/reports/**
            ${{ runner.temp }}/sahm/apps/sahm-android/core/build/reports/**
            ${{ runner.temp }}/sahm/apps/sahm-android/core/build/test-results/**
      - name: Permit emulator acceleration on this disposable runner
        if: success()
        run: sudo chmod a+rw /dev/kvm
      - name: Emulator database and lifecycle verification
        if: success()
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          working-directory: ${{ runner.temp }}/sahm/apps/sahm-android
          script: gradle --no-daemon :app:connectedDebugAndroidTest --stacktrace
      - name: Expose actual native test results
        if: always()
        run: python3 sahm-workspace/tools/report_native_tests.py "$RUNNER_TEMP/sahm/apps/sahm-android"
      - name: Retain on-device test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: sahm-android-device-tests
          retention-days: 14
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/sahm/apps/sahm-android/app/build/reports/androidTests/**
            ${{ runner.temp }}/sahm/apps/sahm-android/app/build/outputs/androidTest-results/**
            ${{ runner.temp }}/sahm/apps/sahm-android/native-test-summary.json
