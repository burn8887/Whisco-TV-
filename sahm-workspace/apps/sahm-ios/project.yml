name: Sahm
options:
  bundleIdPrefix: app.sahm
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.2.0'
    CURRENT_PROJECT_VERSION: 2
    DEVELOPMENT_TEAM: ''
targets:
  Sahm:
    type: application
    platform: iOS
    sources: [Sahm]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.sahm.ios.demo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Sahm/Info.plist
        TARGETED_DEVICE_FAMILY: '1,2'
        OTHER_LDFLAGS: '$(inherited) -lsqlite3'
  SahmTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SahmTests]
    dependencies:
      - target: Sahm
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Sahm:
    build:
      targets:
        Sahm: all
    test:
      targets: [SahmTests]
